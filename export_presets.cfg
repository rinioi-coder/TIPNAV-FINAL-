html/head_include="<script>
  window.accelerometerData = { x: 0, y: 0, z: 0 };
window.isAccelActive = false;

async function requestAccelerometerPermission() {
  // Check for iOS 13+ DeviceMotionEvent permission requirement
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const response = await DeviceMotionEvent.requestPermission();
      if (response === 'granted') {
        startDeviceMotion();
        return true;
      } else {
        console.warn('Accelerometer permission denied by user.');
        return false;
      }
    } catch (error) {
      console.error('Error requesting permission:', error);
      return false;
    }
  } 
  // Modern Sensor API (Chromium-based browsers)
  else if ('Accelerometer' in window) {
    try {
      const acl = new Accelerometer({ frequency: 60 });
      acl.addEventListener('reading', () => {
        window.accelerometerData.x = acl.x;
        window.accelerometerData.y = acl.y;
        window.accelerometerData.z = acl.z;
      });
      acl.start();
      window.isAccelActive = true;
      return true;
    } catch (error) {
      console.error('Accelerometer error:', error);
      // Fall back to devicemotion if Generic Sensors fail
      startDeviceMotion();
      return true;
    }
  } 
  // Standard devicemotion fallback (Android Chrome, legacy browsers)
  else {
    startDeviceMotion();
    return true;
  }
}

function startDeviceMotion() {
  window.addEventListener('devicemotion', (event) => {
    if (event.accelerationIncludingGravity) {
      window.accelerometerData.x = event.accelerationIncludingGravity.x || 0;
      window.accelerometerData.y = event.accelerationIncludingGravity.y || 0;
      window.accelerometerData.z = event.accelerationIncludingGravity.z || 0;
    }
  });
  window.isAccelActive = true;
}
</script>"
